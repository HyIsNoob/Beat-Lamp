plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name = 'MinecraftForge'
		url = 'https://maven.minecraftforge.net/'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"beatlamp" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	neoforge {
		java {
			srcDirs = ['neoforge/src/main/java']
		}
		resources {
			srcDirs = ['neoforge/src/main/resources']
		}
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
	forge {
		java {
			srcDirs = ['forge/src/main/java']
		}
		resources {
			srcDirs = ['forge/src/main/resources']
		}
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
	forge1201 {
		java {
			srcDirs = ['forge-1.20.1/src/main/java']
		}
		resources {
			srcDirs = ['forge-1.20.1/src/main/resources']
		}
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
	fabric1201 {
		java {
			srcDirs = ['fabric-1.20.1/src/main/java']
		}
		resources {
			srcDirs = ['fabric-1.20.1/src/main/resources']
		}
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// NeoForge dependencies for multi-loader compilation
	neoforgeImplementation "net.neoforged:neoforge:21.1.80:universal"
	neoforgeImplementation "net.neoforged.fancymodloader:loader:4.0.31"
	neoforgeImplementation "net.neoforged:bus:8.0.2"
	neoforgeImplementation sourceSets.main.output
	neoforgeImplementation sourceSets.client.output

	// Forge dependencies for multi-loader compilation
	forgeImplementation "net.minecraftforge:forge:1.21.1-52.0.57:universal"
	forgeImplementation "net.minecraftforge:javafmllanguage:1.21.1-52.0.57"
	forgeImplementation "net.minecraftforge:fmlcore:1.21.1-52.0.57"
	forgeImplementation "net.minecraftforge:fmlloader:1.21.1-52.0.57"
	forgeImplementation "net.minecraftforge:forgespi:7.1.5"
	forgeImplementation "net.minecraftforge:eventbus:6.2.27"
	forgeImplementation sourceSets.main.output
	forgeImplementation sourceSets.client.output

	// Forge 1.20.1 dependencies for backport compilation
	forge1201Implementation "net.minecraftforge:forge:1.20.1-47.3.0:universal"
	forge1201Implementation "net.minecraftforge:javafmllanguage:1.20.1-47.3.0"
	forge1201Implementation "net.minecraftforge:fmlcore:1.20.1-47.3.0"
	forge1201Implementation "net.minecraftforge:fmlloader:1.20.1-47.3.0"
	forge1201Implementation "net.minecraftforge:forgespi:6.0.0"
	forge1201Implementation "net.minecraftforge:eventbus:6.0.5"

	// Fabric 1.20.1 dependencies for backport compilation
	fabric1201Implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs << "-Xlint:deprecation"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	archiveClassifier = 'fabric'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

remapJar {
	archiveFileName = "beatlamp-fabric-${project.minecraft_version}-${project.version}.jar"
}

remapSourcesJar {
	archiveFileName = "beatlamp-sources-${project.minecraft_version}-${project.version}.jar"
}

task neoforgeJar(type: Jar, dependsOn: [classes, clientClasses, neoforgeClasses]) {
	def projectName = project.name
	archiveFileName = "beatlamp-neoforge-${project.minecraft_version}-${project.version}.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.client.output
	from sourceSets.neoforge.output
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	exclude 'fabric.mod.json'
	exclude 'beatlamp.client.mixins.json'
	exclude 'com/beatlamp/fabric/**'
}

task forgeJar(type: Jar, dependsOn: [classes, clientClasses, forgeClasses]) {
	def projectName = project.name
	archiveFileName = "beatlamp-forge-${project.minecraft_version}-${project.version}.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.client.output
	from sourceSets.forge.output
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	exclude 'fabric.mod.json'
	exclude 'beatlamp.client.mixins.json'
	exclude 'com/beatlamp/fabric/**'
}

tasks.named('compileForge1201Java', JavaCompile) {
	options.release = 17
	options.compilerArgs << "-Xlint:deprecation"
	def userHome = System.getProperty("user.home")
	def loomMcDir = file("${userHome}/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft")
	def mc1201Jars = fileTree(dir: loomMcDir, include: '**/*1.20.1*.jar')
	def cp = classpath.filter { file ->
		!file.name.contains("1.21.1")
	}
	classpath = cp + mc1201Jars
}

task rawForge1201Jar(type: Jar, dependsOn: [forge1201Classes]) {
	def projectName = project.name
	archiveFileName = "beatlamp-forge-1.20.1-${project.version}-raw.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.forge1201.output
	from ("src/main/resources") {
		exclude 'fabric.mod.json'
		exclude 'beatlamp.mixins.json'
		exclude 'beatlamp.client.mixins.json'
		exclude 'pack.mcmeta'
	}
	from ("src/client/resources") {
		exclude 'beatlamp.client.mixins.json'
	}
	from ("forge-1.20.1/src/main/resources")
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

task forge1201Jar(dependsOn: [rawForge1201Jar]) {
	doLast {
		def userHome = System.getProperty("user.home")
		def tsrgFile = file("${userHome}/.gradle/caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.20.1-20230612.114412/srg_to_official_1.20.1.tsrg")
		def inJar = file("${buildDir}/libs/beatlamp-forge-1.20.1-${project.version}-raw.jar")
		def outJar = file("${buildDir}/libs/beatlamp-forge-1.20.1-${project.version}.jar")
		def asmFiles = fileTree(dir: "${userHome}/.gradle/caches", include: '**/asm*.jar').files
		def asmCp = asmFiles.collect { it.absolutePath }.unique().join(File.pathSeparator)
		def remapperClassDir = file("${buildDir}/remapperClasses")
		remapperClassDir.mkdirs()

		def pb1 = new ProcessBuilder("javac", "-cp", asmCp, "-d", remapperClassDir.absolutePath, "gradle/tools/SrgRemapper.java")
		pb1.inheritIO().start().waitFor()

		def mojangJars = fileTree(dir: "${userHome}/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft", include: '**/*1.20.1*.jar').files.findAll { !it.name.contains("sources") && !it.name.contains("intermediary") }
		def args = ["java", "-cp", "${remapperClassDir.absolutePath}${File.pathSeparator}${asmCp}", "SrgRemapper", tsrgFile.absolutePath, inJar.absolutePath, outJar.absolutePath]
		mojangJars.each { args.add(it.absolutePath) }
		def pb2 = new ProcessBuilder(args as String[])
		pb2.inheritIO().start().waitFor()
	}
}

tasks.named('compileFabric1201Java', JavaCompile) {
	options.release = 17
	options.compilerArgs << "-Xlint:deprecation"
	def userHome = System.getProperty("user.home")
	def loomMcDir = file("${userHome}/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft")
	def mc1201Jars = fileTree(dir: loomMcDir, include: '**/*1.20.1*.jar')
	def cp = classpath.filter { file ->
		!file.name.contains("1.21.1")
	}
	classpath = cp + mc1201Jars
}

task fabric1201Jar(type: Jar, dependsOn: [fabric1201Classes]) {
	def projectName = project.name
	archiveFileName = "beatlamp-fabric-1.20.1-${project.version}.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.fabric1201.output
	from ("src/main/resources") {
		exclude 'fabric.mod.json'
		exclude 'beatlamp.mixins.json'
		exclude 'beatlamp.client.mixins.json'
		exclude 'pack.mcmeta'
	}
	from ("src/client/resources") {
		exclude 'beatlamp.client.mixins.json'
	}
	from ("fabric-1.20.1/src/main/resources")
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

assemble.dependsOn neoforgeJar, forgeJar, forge1201Jar, fabric1201Jar

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
