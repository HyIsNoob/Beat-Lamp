[[mods]] #mandatory
modId = "music_disc_maker" #mandatory
version = "3.0.2" #mandatory
displayName = "Music Disc Maker" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/music-disc-maker" #optional (displayed in the mod UI)
logoFile = "music_disc_maker.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
credits="" #optional
authors = "KURONAMI" #optional
description = '''Paste a URL into the Music Disc Maker block and turn a Blank Disc into a custom music disc you can play in any vanilla jukebox. Supports YouTube, Spotify, SoundCloud, Bandcamp, Vimeo, Twitch and direct HTTP audio streams (audio is bundled via LavaPlayer, no extra install). Disclaimer: streaming audio from third-party services is the user's responsibility. Please respect the Terms of Service of each service you use.''' #mandatory (Supports multiline text)
[[mixins]]
config = "music_disc_maker.mixins.json"
[[mixins]]
config = "music_disc_maker.neoforge.mixins.json"
